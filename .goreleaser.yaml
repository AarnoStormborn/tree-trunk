# GoReleaser configuration (docs/design/05-implementation-plan.md M5).
# Release flow: tag vX.Y.Z on main → workflow builds + uploads binaries →
# Homebrew tap formula updated via the brew section below.
#
# Prereq: create the AarnoStormborn/homebrew-tap repo (empty), then the
# first `goreleaser release` publishes the formula there.
version: 2

project_name: tree-trunk

before:
  hooks:
    - go mod tidy

builds:
  - id: tree-trunk
    main: ./cmd/tree-trunk
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - repository:
      owner: AarnoStormborn
      name: homebrew-tap
    directory: Formula
    homepage: https://github.com/AarnoStormborn/tree-trunk
    description: TUI for all your git repos and worktrees
    test: |
      system "#{bin}/tree-trunk --version"
